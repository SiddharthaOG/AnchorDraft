[project]
name = "engine"
version = "0.1.0"
description = "AnchorDraft Review Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "asyncpg==0.29.0",
    "PyJWT==2.15.1",
    "python-multipart==0.0.6",
    "pypdf==3.17.0",
    "python-docx==1.1.0",
    "httpx==0.28.1",
    "groq==0.13.0",
    "google-genai==0.3.0",
    "supabase==2.34.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.uvicorn]
app = "engine.app.main:app"
host = "0.0.0.0"
port = 8000
reload = true